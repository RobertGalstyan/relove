<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:LOVE · Level 05 · Վերջնական Ընտրություն</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161820;
            --accent-pink: #e879f9;
            --accent-rose: #f43f5e;
            --accent-glow: rgba(232, 121, 249, 0.18);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(232, 121, 249, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(232, 121, 249, 0.09) 0%, transparent 55%),
                radial-gradient(circle at 80% 85%, rgba(244, 63, 94, 0.07) 0%, transparent 55%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 36px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 35px var(--accent-glow);
            position: relative;
            backdrop-filter: blur(12px);
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            text-align: center;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: var(--accent-pink);
            margin-bottom: 12px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .heart-container {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heart {
            width: 28px;
            height: 28px;
            background-color: var(--accent-pink);
            transform: rotate(-45deg);
            position: relative;
            animation: pulse 2.2s infinite ease-in-out;
            box-shadow: 0 0 18px rgba(232, 121, 249, 0.6);
        }

        .heart::before,
        .heart::after {
            content: "";
            width: 28px;
            height: 28px;
            background-color: var(--accent-pink);
            border-radius: 50%;
            position: absolute;
        }

        .heart::before { top: -14px; left: 0; }
        .heart::after { left: 14px; top: 0; }

        @keyframes pulse {
            0% { transform: rotate(-45deg) scale(0.95); opacity: 0.85; }
            50% { transform: rotate(-45deg) scale(1.08); opacity: 1; box-shadow: 0 0 28px rgba(232, 121, 249, 0.85); }
            100% { transform: rotate(-45deg) scale(0.95); opacity: 0.85; }
        }

        .level-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .question-box {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(232, 121, 249, 0.15);
            border-radius: 20px;
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .question-sub {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* Interactive Area for Buttons */
        .btn-wrapper {
            position: relative;
            width: 100%;
            height: 120px;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .glow-btn {
            padding: 16px 28px;
            border: none;
            border-radius: 16px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-yes {
            background: linear-gradient(135deg, #e879f9 0%, #f43f5e 100%);
            box-shadow: 0 4px 25px rgba(244, 63, 94, 0.35);
            z-index: 2;
        }

        .btn-yes:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(232, 121, 249, 0.45);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            position: absolute;
            transition: all 0.15s ease-out; /* Ավելի արագ փախչելու համար */
            z-index: 10;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 16px;
            animation: floatUp 2.5s forwards cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1000;
            opacity: 0.9;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-120px) scale(1.4) rotate(25deg);
                opacity: 0;
            }
        }

        .status-message {
            margin-top: 10px;
            font-size: 13px;
            color: var(--accent-pink);
            opacity: 0;
            transition: opacity 0.5s ease;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .status-message.show {
            opacity: 1;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #475569;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div class="header">
            <div class="logo">RE : LOVE</div>
            <div class="heart-container">
                <div class="heart"></div>
            </div>
            <div class="level-badge">Level 05 · Վերջնական Ընտրություն</div>
        </div>

        <div class="question-box">
            <h2 class="question-title">Գնո՞ւմ ենք միասին մեր նոր սկզբին ✨</h2>
            <p class="question-sub">Ընտրիր տարբերակներից մեկը 🤍</p>
        </div>

        <div class="btn-wrapper" id="btn-wrapper">
            <button class="glow-btn btn-yes" onclick="sendResponse(event, 'Այո՛, անպայման 💖')">
                <span>💖 Այո՛, անպայման</span>
            </button>
            
            <button class="glow-btn btn-no" id="no-btn">
                <span>❌ Ոչ</span>
            </button>
        </div>

        <div class="status-message" id="status-msg"></div>

        <div class="footer">
            INTERACTIVE RELATIONSHIP REPAIR
        </div>
    </div>

    <script>
        const FORMSPREE_ID = "mljdlzlz";
        const noBtn = document.getElementById("no-btn");
        const container = document.getElementById("main-container");

        // Էջը բացելու ծանուցում
        document.addEventListener("DOMContentLoaded", () => {
            notifyEvent("👁️ Level 05 Page Opened");
            
            // Սկզբնական դիրքավորում "Ոչ" կոճակի համար
            resetNoBtnPosition();
        });

        function resetNoBtnPosition() {
            noBtn.style.right = "20px";
            noBtn.style.top = "50%";
            noBtn.style.transform = "translateY(-50%)";
        }

        // Փախչելու ֆունկցիան
        function moveButton() {
            const containerRect = container.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Հաշվում ենք թույլատրելի առավելագույն սահմանները տարայի (container) ներսում
            const maxX = containerRect.width - btnRect.width - 30;
            const maxY = containerRect.height - btnRect.height - 30;

            const randomX = Math.max(15, Math.floor(Math.random() * maxX));
            const randomY = Math.max(15, Math.floor(Math.random() * maxY));

            noBtn.style.position = "absolute";
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            noBtn.style.transform = "none";
            
            // Ուղարկում ենք ծանուցում, որ փորձել է "Ոչ" սեղմել
            notifyEvent("Ոչ կոճակը փախավ 😈");
        }

        // Մկնիկը մոտեցնելիս կամ հեռախոսով դիպչելիս
        noBtn.addEventListener("mouseenter", moveButton);
        noBtn.addEventListener("touchstart", (e) => {
            e.preventDefault(); // Կանխում է սեղմելը հեռախոսի վրա
            moveButton();
        });

        async function sendResponse(event, answer) {
            createParticles(event);

            const statusMsg = document.getElementById("status-msg");
            statusMsg.innerText = "✨ Գիտեի, որ ճիշտ ընտրություն կանես․․․ 🤍";
            statusMsg.classList.add("show");

            await notifyEvent(`💌 Response: ${answer}`);
        }

        async function notifyEvent(eventName) {
            if (!FORMSPREE_ID) return;
            try {
                await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        event: eventName,
                        level: "Level 05 - Escape No Button",
                        time: new Date().toLocaleString()
                    })
                });
            } catch (error) {
                console.error("Error sending notification:", error);
            }
        }

        function createParticles(e) {
            const symbols = ["✨", "💖", "🤍", "🌸", "⭐", "🎉"];
            const count = 16;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement("div");
                particle.className = "particle";
                particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];

                const rect = e.target.getBoundingClientRect();
                const x = (e.clientX || (rect.left + rect.width / 2)) + (Math.random() * 80 - 40);
                const y = (e.clientY || (rect.top + rect.height / 2)) + (Math.random() * 20 - 10);

                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                document.body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 2400);
            }
        }
    </script>
</body>
</html>
