<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:LOVE · Level 06 · Անակնկալների Անիվ</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161820;
            --accent-pink: #e879f9;
            --accent-rose: #f43f5e;
            --accent-glow: rgba(232, 121, 249, 0.18);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(232, 121, 249, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(232, 121, 249, 0.09) 0%, transparent 55%),
                radial-gradient(circle at 80% 85%, rgba(244, 63, 94, 0.07) 0%, transparent 55%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 32px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 35px var(--accent-glow);
            position: relative;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: var(--accent-pink);
            margin-bottom: 10px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .level-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        /* Wheel Styles */
        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pointer / Arrow */
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid var(--accent-pink);
            z-index: 10;
            filter: drop-shadow(0 0 8px var(--accent-pink));
        }

        #wheel-canvas {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(232, 121, 249, 0.3), inset 0 0 15px rgba(0,0,0,0.5);
            transition: transform 4.5s cubic-bezier(0.15, 0.9, 0.15, 1);
        }

        .wheel-center-cap {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #f43f5e 0%, #0d0e12 100%);
            border: 2px solid var(--accent-pink);
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(232, 121, 249, 0.6);
        }

        /* Spin Button */
        .glow-btn {
            width: 100%;
            max-width: 280px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #e879f9 0%, #f43f5e 100%);
            box-shadow: 0 4px 25px rgba(244, 63, 94, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .glow-btn:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(232, 121, 249, 0.5);
        }

        .glow-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Card Overlay */
        .result-box {
            margin-top: 20px;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--accent-pink);
            border-radius: 18px;
            text-align: center;
            width: 100%;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .result-box.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .result-title {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .result-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-pink);
            line-height: 1.4;
        }

        /* Particles */
        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 18px;
            animation: floatUp 2.5s forwards cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1000;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-130px) scale(1.4) rotate(30deg);
                opacity: 0;
            }
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #475569;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">RE : LOVE</div>
            <div class="level-badge">Level 06 · Անակնկալների Անիվ</div>
            <h1 class="title">Պտտիր և շահիր քո անակնկալը ✨</h1>
        </div>

        <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <canvas id="wheel-canvas" width="640" height="640"></canvas>
            <div class="wheel-center-cap">💖</div>
        </div>

        <button class="glow-btn" id="spin-btn" onclick="spinWheel(event)">
            <span>🎡 Պտտել Անիվը</span>
        </button>

        <div class="result-box" id="result-box">
            <div class="result-title">🎉 Քո շահած անակնկալը․</div>
            <div class="result-text" id="result-text">---</div>
        </div>

        <div class="footer">
            INTERACTIVE RELATIONSHIP REPAIR
        </div>
    </div>

    <script>
        const FORMSPREE_ID = "mzezlbeg";

        // Անիվի տարբերակները (էմոջի + տեքստ)
        const prizes = [
            { icon: "💆‍♀️", label: "Անմոռանալի մերսում" },
            { icon: "☕", label: "Սուրճ մահճակալում"},
            { icon: "🎬", label: "Կինոդիտում" },
            { icon: "🍷", label: "Ռոմանտիկ ընթրիք" },
            { icon: "🌙", label: "Քաղաքից դուրս" },
            { icon: "🥰", label: "Բոլորը միասին" }
        ];

        // Գույները (RE:LOVE պալիտրայով)
        const colors = [
            "#1e1b2e", "#2a1b3d", "#1e1b2e", 
            "#341948", "#1e1b2e", "#3d1b40"
        ];

        const canvas = document.getElementById("wheel-canvas");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spin-btn");
        const resultBox = document.getElementById("result-box");
        const resultText = document.getElementById("result-text");

        const numPrizes = prizes.length;
        const arcSize = (2 * Math.PI) / numPrizes;
        let currentRotation = 0;
        let isSpinning = false;

        document.addEventListener("DOMContentLoaded", () => {
            drawWheel();
            notifyEvent("👁️ Level 06 Page Opened");
        });

        // Անիվի նկարում Canvas-ի վրա
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numPrizes; i++) {
                const angle = i * arcSize;

                // Սեգմենտի ֆոնը
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                // Սեգմենտի եզրագիծը
                ctx.strokeStyle = "rgba(232, 121, 249, 0.25)";
                ctx.lineWidth = 3;
                ctx.stroke();

                // Տեքստի և էմոջիի նկարում
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);

                ctx.textAlign = "right";
                ctx.fillStyle = "#f8fafc";
                ctx.font = "bold 22px 'Montserrat', sans-serif";
                
                // Տեքստը
                ctx.fillText(`${prizes[i].icon} ${prizes[i].label}`, radius - 35, 8);
                ctx.restore();
            }
        }

        // Անիվի պտույտի ֆունկցիան
        function spinWheel(event) {
            if (isSpinning) return;
            isSpinning = true;

            spinBtn.disabled = true;
            resultBox.classList.remove("show");

            // Պատահական ընտրում ենք շահող ինդեքսը
            const selectedIndex = Math.floor(Math.random() * numPrizes);
            const prize = prizes[selectedIndex];

            // Հաշվում ենք պտույտի աստիճանը (մինիմում 5 լրիվ պտույտ + ճիշտ սեգմենտ)
            // Անիվի սլաքը վերևում է (-90 աստիճան / -PI/2)
            const extraRounds = 360 * 6; // 6 լրիվ պտույտ
            const segmentDegrees = 360 / numPrizes;
            
            // Հաշվարկում ենք ճիշտ կանգառի անկյունը
            const targetDegree = extraRounds + (360 - (selectedIndex * segmentDegrees) - (segmentDegrees / 2) - 90);

            currentRotation += targetDegree;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Երբ պտույտը ավարտվում է (4.5 վայրկյանից)
            setTimeout(async () => {
                isSpinning = false;

                // Ցույց ենք տալիս արդյունքը
                resultText.innerText = `${prize.icon} ${prize.label}`;
                resultBox.classList.add("show");

                // Ստեղծում ենք մասնիկներ
                createParticles(event);

                // Ուղարկում ենք ծանուցում Formspree-ին
                await notifyEvent(`🎡 Won Prize: ${prize.label}`);

            }, 4500);
        }

        async function notifyEvent(eventName) {
            if (!FORMSPREE_ID) return;
            try {
                await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        event: eventName,
                        level: "Level 06 - Love Wheel",
                        time: new Date().toLocaleString()
                    })
                });
            } catch (error) {
                console.error("Error sending notification:", error);
            }
        }

        function createParticles(e) {
            const symbols = ["✨", "💖", "🍷", "☕", "🌸", "⭐", "🎉"];
            const count = 18;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement("div");
                particle.className = "particle";
                particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];

                const x = (window.innerWidth / 2) + (Math.random() * 160 - 80);
                const y = (window.innerHeight / 2) + (Math.random() * 100 - 50);

                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                document.body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 2400);
            }
        }
    </script>
</body>
</html>
